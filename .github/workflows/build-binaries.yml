name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej. 4.8.0)'
        required: true
        default: '4.8.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            # Extraer tag sin prefijo 'v'
            TAG="${GITHUB_REF_NAME#v}"
            echo "VERSION=$TAG" >> $GITHUB_ENV
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux standalone packages
        run: |
          python scripts/build_linux.py --version ${{ env.VERSION }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist-release/*.AppImage
            dist-release/*.tar.gz
            dist-release/SHA256SUMS-linux.txt

  build-windows:
    name: Build Windows (Setup.exe & portable .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "VERSION=$TAG" >> $GITHUB_ENV
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows folder with Flet pack
        run: |
          python -m flet_cli pack app.py --onedir --name Melomaniac --add-data "resources;resources" --hidden-import "mutagen" -y --pyinstaller-build-args="--collect-data=ytmusicapi"

      - name: Create release directory
        shell: bash
        run: |
          mkdir -p dist-release

      - name: Compile Inno Setup installer
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc /DMyAppVersion=${{ env.VERSION }} scripts\windows\installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} scripts\windows\installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.VERSION }} scripts\windows\installer.iss
          } else {
            Write-Error "ISCC.exe no fue encontrado."
            exit 1
          }

      - name: Create Portable ZIP
        shell: bash
        run: |
          cd dist
          7z a "../dist-release/Melomaniac-v${{ env.VERSION }}-windows-x64.zip" Melomaniac/
          cd ..

      - name: Generate SHA256 hashes
        shell: bash
        run: |
          cd dist-release
          sha256sum Melomaniac-v${{ env.VERSION }}-windows-x64* > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist-release/*-windows-x64-Setup.exe
            dist-release/*-windows-x64.zip
            dist-release/SHA256SUMS-windows.txt

  publish-to-release:
    name: Upload Binaries to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Target Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TARGET_TAG=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "TARGET_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ env.TARGET_TAG }} dist-release/* --clobber
